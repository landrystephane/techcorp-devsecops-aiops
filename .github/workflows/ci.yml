name: TECHCORP Security CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège par défaut : le jeton ne peut que lire le dépôt.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # nécessaire pour lister les commits d'une PR
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0          # tout l'historique : un secret supprimé reste dans Git
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # pas de droit d'écriture sur les PR

  dependencies:
    name: Dépendances (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    name: Image Docker (build + Trivy)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Docker build
        run: docker build -t techcorp-api:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: techcorp-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [tests, secrets, dependencies, image]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "tests        : ${{ needs.tests.result }}"
          echo "secrets      : ${{ needs.secrets.result }}"
          echo "dependencies : ${{ needs.dependencies.result }}"
          echo "image        : ${{ needs.image.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Quality gate refusé : au moins un contrôle a échoué."
            exit 1
          fi
          echo "Quality gate accepté."